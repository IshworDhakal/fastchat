<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FastChat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0c10; --surface: #13151c; --border: #1e2130;
    --accent: #00e5ff; --accent2: #ff4ecd; --text: #e0e6f0;
    --muted: #5a6280; --self-bg: #00e5ff18; --other-bg: #1a1d2e;
    --sys-col: #ff4ecd; --radius: 10px;
    --mono: 'IBM Plex Mono', monospace; --display: 'Syne', sans-serif;
  }
  body { font-family: var(--mono); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* Auth */
  #auth-overlay { position: fixed; inset: 0; background: #0b0c10ee; display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 320px; box-shadow: 0 0 60px #00e5ff22; }
  .auth-card h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-card input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: .85rem; padding: 11px 14px; outline: none; transition: border-color .2s; }
  .auth-card input:focus { border-color: var(--accent); }
  .auth-card input::placeholder { color: var(--muted); }
  .btn-row { display: flex; gap: 10px; }
  .btn { flex: 1; border: none; border-radius: var(--radius); padding: 12px; font-family: var(--display); font-weight: 700; font-size: .85rem; cursor: pointer; transition: opacity .2s; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #000; }
  .btn-secondary { background: var(--other-bg); color: var(--text); border: 1px solid var(--border); }
  .btn:hover { opacity: .85; }
  .error-msg { font-size: .75rem; color: #ff4ecd; min-height: 18px; text-align: center; }

  /* Layout */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { font-family: var(--display); font-size: 1.2rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #current-user { font-size: .75rem; color: var(--accent); }
  #chat-title { font-size: .85rem; color: var(--text); margin-left: auto; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; margin-left: 12px; }
  .dot.live { background: #3dff80; box-shadow: 0 0 6px #3dff8099; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Left sidebar */
  .left-sidebar { width: 240px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
  .sidebar-search { padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar-search input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: var(--mono); font-size: .78rem; padding: 8px 14px; outline: none; }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search input::placeholder { color: var(--muted); }
  .sidebar-section { padding: 8px 12px 4px; font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .sidebar-scroll { flex: 1; overflow-y: auto; }
  .sidebar-scroll::-webkit-scrollbar { width: 3px; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); }

  /* Contact/Room items */
  .chat-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-radius: 8px; margin: 2px 6px; transition: background .15s; }
  .chat-item:hover { background: var(--other-bg); }
  .chat-item.active { background: var(--other-bg); border-left: 2px solid var(--accent); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700; flex-shrink: 0; background: var(--border); color: var(--text); position: relative; }
  .avatar.room { border-radius: 8px; background: #1a1d2e; color: var(--accent); font-size: .7rem; }
  .online-badge { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: #3dff80; border: 2px solid var(--surface); }
  .chat-item-info { flex: 1; min-width: 0; }
  .chat-item-name { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-preview { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  /* Chat area */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; max-width: 65%; animation: slideUp .2s ease; }
  .msg.self { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .msg.system { align-self: center; max-width: 100%; }
  .msg-meta { font-size: .62rem; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; }
  .msg-meta .sender { color: var(--accent); font-weight: 600; }
  .msg.self .msg-meta .sender { color: var(--accent2); }
  .bubble { padding: 10px 14px; border-radius: 18px; font-size: .82rem; line-height: 1.5; word-break: break-word; }
  .msg.self .bubble { background: linear-gradient(135deg, var(--accent), #0099bb); color: #000; border-bottom-right-radius: 4px; }
  .msg.other .bubble { background: var(--other-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: transparent; border: none; color: var(--sys-col); font-size: .7rem; text-align: center; padding: 2px 0; }

  /* Input */
  .input-bar { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
  #msg-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: var(--mono); font-size: .82rem; padding: 10px 16px; outline: none; transition: border-color .2s; }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--muted); }
  #msg-input:disabled { opacity: .4; }
  #send-btn { background: linear-gradient(135deg, var(--accent), #0099bb); color: #000; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #send-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* Empty state */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; }
  .empty-state .icon { font-size: 3rem; }
  .empty-state p { font-size: .82rem; }

  .unread-badge {
    background: #ff4ecd;
    color: #fff;
    font-size: .65rem;
    font-weight: 700;
    border-radius: 50%;
    min-width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    margin-left: auto;
    flex-shrink: 0;
  }


  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>FastChat</h2>
    <input id="auth-username" type="text" placeholder="Username" maxlength="24" autocomplete="off"/>
    <input id="auth-password" type="password" placeholder="Password" maxlength="64"/>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doAuth('login')">Login</button>
      <button class="btn btn-secondary" onclick="doAuth('register')">Register</button>
    </div>
    <div class="error-msg" id="auth-error"></div>
  </div>
</div>

<!-- Shell -->
<header>
  <span class="logo">FastChat</span>
  <span id="current-user"></span>
  <span id="chat-title"></span>
  <span class="dot" id="dot"></span>
</header>

<div class="layout">
  <!-- Left sidebar -->
  <div class="left-sidebar">
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Search..." oninput="filterContacts(this.value)"/>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-section">Rooms</div>
      <div id="room-list"></div>
      <div class="sidebar-section">Direct Messages</div>
      <div id="contact-list"></div>
    </div>
  </div>

  <!-- Chat -->
  <main>
    <div id="messages">
      <div class="empty-state">
        <div class="icon">💬</div>
        <p>Select a room or user to start chatting</p>
      </div>
    </div>
    <div class="input-bar">
      <input id="msg-input" type="text" placeholder="Type a message..." disabled autocomplete="off"/>
      <button id="send-btn" disabled onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<script>
  let ws = null;
  let myName = "";
  let currentChat = null;   // { type: 'room'|'dm', id: string }
  let allUsers = [];
  let unreadCounts = {};
  let onlineUsers = [];

  // ── Auth ──────────────────────────────────────
  function doAuth(action) {
    const username = document.getElementById("auth-username").value.trim();
    const password = document.getElementById("auth-password").value.trim();
    if (!username || !password) { showError("Please enter username and password."); return; }
    connectWS(action, username, password);
  }

  function connectWS(action, username, password) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => ws.send(JSON.stringify({ action, username, password }));
    ws.onmessage = e => handleMessage(JSON.parse(e.data));
    ws.onclose = () => document.getElementById("dot").className = "dot";
  }

  function handleMessage(msg) {
    if (msg.type === "auth_fail") { showError(msg.text); ws.close(); return; }

    if (msg.type === "auth_ok") {
      myName = msg.username;
      allUsers = msg.all_users;
      onlineUsers = msg.online_users;
      document.getElementById("auth-overlay").style.display = "none";
      document.getElementById("current-user").textContent = myName;
      document.getElementById("dot").className = "dot live";
      document.getElementById("msg-input").disabled = false;
      document.getElementById("send-btn").disabled = false;
      buildRoomList(msg.rooms);
      buildContactList();
      return;
    }

    if (msg.type === "user_online") {
      onlineUsers = msg.online_users;
      buildContactList();
      return;
    }

    if (msg.type === "user_offline") {
      onlineUsers = msg.online_users;
      buildContactList();
      return;
    }

    if (msg.type === "history") {
      if (currentChat?.type === "room" && currentChat?.id === msg.room) {
        document.getElementById("messages").innerHTML = "";
        msg.messages.forEach(m => appendMessage(m.sender, m.text, m.timestamp, m.sender === myName));
      }
      return;
    }

    if (msg.type === "dm_history") {
      if (currentChat?.type === "dm" && currentChat?.id === msg.with) {
        document.getElementById("messages").innerHTML = "";
        msg.messages.forEach(m => appendMessage(m.sender, m.text, m.timestamp, m.sender === myName));
      }
      return;
    }

    if (msg.type === "system") {
      if (currentChat?.type === "room") appendSystem(msg.text);
      if (msg.users) updateRoomUsers(msg.users);
      return;
    }

    if (msg.type === "message") {
      if (currentChat?.type === "room" && currentChat?.id === msg.room) {
        appendMessage(msg.sender, msg.text, msg.timestamp, msg.sender === myName);
      }
      return;
    }

    if (msg.type === "dm") {
      const other = msg.sender === myName ? msg.receiver : msg.sender;
      if (currentChat?.type === "dm" && currentChat?.id === other) {
        appendMessage(msg.sender, msg.text, msg.timestamp, msg.sender === myName);
      }
      // Flash contact
      flashContact(other === myName ? msg.sender : other);
      return;
    }
  }

  // ── Sidebar ───────────────────────────────────
  function buildRoomList(rooms) {
    document.getElementById("room-list").innerHTML = rooms.map(r => `
      <div class="chat-item" id="room-${r}" onclick="openRoom('${r}')">
        <div class="avatar room">#</div>
        <div class="chat-item-info">
          <div class="chat-item-name">${esc(r)}</div>
          <div class="chat-item-preview">Tap to join</div>
        </div>
      </div>
    `).join("");
    // Auto open general
    openRoom("general");
  }

  function buildContactList(filter = "") {
    const others = allUsers.filter(u => u !== myName && u.toLowerCase().includes(filter.toLowerCase()));
    document.getElementById("contact-list").innerHTML = others.length === 0
      ? `<div style="padding:10px 14px;font-size:.72rem;color:var(--muted)">No users found</div>`
      : others.map(u => {
          const isOnline = onlineUsers.includes(u);
          const initial = u[0].toUpperCase();
          return `
            <div class="chat-item" id="dm-${u}" onclick="openDM('${u}')">
              <div class="avatar">
                ${initial}
                ${isOnline ? '<div class="online-badge"></div>' : ''}
              </div>
              <div class="chat-item-info">
                <div class="chat-item-name">${esc(u)}</div>
                <div class="chat-item-preview">${isOnline ? 'Online' : 'Offline'}</div>
              </div>
            </div>
          `;
        }).join("");
  }

  function filterContacts(val) {
    buildContactList(val);
  }

  function updateRoomUsers(users) {}

  function flashContact(username) {
    const el = document.getElementById(`dm-${username}`);
    if (el) {
      el.style.borderLeft = "2px solid var(--accent2)";
      setTimeout(() => el.style.borderLeft = "", 2000);
    }
  }

  // ── Open chats ────────────────────────────────
  function openRoom(room) {
    currentChat = { type: "room", id: room };
    setActiveItem(`room-${room}`);
    document.getElementById("chat-title").textContent = `# ${room}`;
    document.getElementById("messages").innerHTML = "";
    ws.send(JSON.stringify({ type: "switch_room", room }));
  }

  function openDM(username) {
    currentChat = { type: "dm", id: username };
    setActiveItem(`dm-${username}`);
    document.getElementById("chat-title").textContent = username;
    document.getElementById("messages").innerHTML = "";
    ws.send(JSON.stringify({ type: "load_dm", with: username }));
  }

  function setActiveItem(id) {
    document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
    const el = document.getElementById(id);
    if (el) el.classList.add("active");
  }

  // ── Messages ──────────────────────────────────
  function appendMessage(sender, text, ts, isSelf) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${isSelf ? "self" : "other"}`;
    div.innerHTML = `
      <div class="msg-meta"><span class="sender">${esc(sender)}</span><span>${esc(ts)}</span></div>
      <div class="bubble">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function appendSystem(text) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg system";
    div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // ── Send ──────────────────────────────────────
  function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    if (currentChat?.type === "dm") {
      ws.send(JSON.stringify({ type: "dm", to: currentChat.id, text }));
    } else {
      ws.send(JSON.stringify({ text }));
    }
    input.value = "";
    input.focus();
  }

  // ── Utils ─────────────────────────────────────
  function showError(msg) { document.getElementById("auth-error").textContent = msg; }

  document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
  });
  document.getElementById("auth-password").addEventListener("keydown", e => {
    if (e.key === "Enter") doAuth("login");
  });

  function esc(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
