<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FastChat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0c10; --surface: #13151c; --border: #1e2130;
    --accent: #00e5ff; --accent2: #ff4ecd; --text: #e0e6f0;
    --muted: #5a6280; --self-bg: #00e5ff18; --other-bg: #1a1d2e;
    --sys-col: #ff4ecd; --radius: 10px;
    --mono: 'IBM Plex Mono', monospace; --display: 'Syne', sans-serif;
  }
  body { font-family: var(--mono); background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* Auth */
  #auth-overlay { position: fixed; inset: 0; background: #0b0c10ee; display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 320px; box-shadow: 0 0 60px #00e5ff22; }
  .auth-card h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-card input { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: .85rem; padding: 11px 14px; outline: none; transition: border-color .2s; }
  .auth-card input:focus { border-color: var(--accent); }
  .auth-card input::placeholder { color: var(--muted); }
  .btn-row { display: flex; gap: 10px; }
  .btn { flex: 1; border: none; border-radius: var(--radius); padding: 12px; font-family: var(--display); font-weight: 700; font-size: .85rem; cursor: pointer; transition: opacity .2s; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #000; }
  .btn-secondary { background: var(--other-bg); color: var(--text); border: 1px solid var(--border); }
  .btn:hover { opacity: .85; }
  .error-msg { font-size: .75rem; color: #ff4ecd; min-height: 18px; text-align: center; }

  /* Layout */
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .logo { font-family: var(--display); font-size: 1.25rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #current-user { font-size: .75rem; color: var(--accent); }
  #current-room-label { font-size: .75rem; color: var(--muted); margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; margin-left: 12px; }
  .dot.live { background: #3dff80; box-shadow: 0 0 6px #3dff8099; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Rooms sidebar */
  .rooms-sidebar { width: 160px; border-right: 1px solid var(--border); background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .sidebar-title { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
  .room-btn { font-size: .78rem; padding: 8px 12px; border-radius: var(--radius); background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer; text-align: left; font-family: var(--mono); transition: all .2s; }
  .room-btn:hover { background: var(--other-bg); color: var(--text); }
  .room-btn.active { background: var(--other-bg); border-color: var(--accent); color: var(--accent); }

  /* Users sidebar */
  .users-sidebar { width: 150px; border-left: 1px solid var(--border); background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .user-pill { font-size: .75rem; padding: 5px 10px; border-radius: 20px; background: var(--other-bg); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; gap: 6px; }
  .user-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #3dff80; flex-shrink: 0; }

  /* Chat */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .msg { display: flex; flex-direction: column; max-width: 68%; animation: slideUp .25s ease; }
  .msg.self { align-self: flex-end; align-items: flex-end; }
  .msg.other { align-self: flex-start; }
  .msg.system { align-self: center; max-width: 100%; }
  .msg-meta { font-size: .65rem; color: var(--muted); margin-bottom: 4px; display: flex; gap: 8px; }
  .msg-meta .sender { color: var(--accent); font-weight: 600; }
  .msg.self .msg-meta .sender { color: var(--accent2); }
  .bubble { padding: 10px 14px; border-radius: var(--radius); font-size: .82rem; line-height: 1.5; word-break: break-word; }
  .msg.self .bubble { background: var(--self-bg); border: 1px solid var(--accent); color: var(--accent); border-bottom-right-radius: 2px; }
  .msg.other .bubble { background: var(--other-bg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg.system .bubble { background: transparent; border: none; color: var(--sys-col); font-size: .72rem; text-align: center; padding: 4px 0; }
  .input-bar { border-top: 1px solid var(--border); background: var(--surface); padding: 14px 20px; display: flex; gap: 10px; align-items: center; }
  #msg-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: .82rem; padding: 10px 14px; outline: none; transition: border-color .2s; }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--muted); }
  #msg-input:disabled { opacity: .4; }
  #send-btn { background: var(--accent); color: #000; border: none; border-radius: var(--radius); padding: 10px 18px; font-family: var(--display); font-weight: 700; font-size: .8rem; cursor: pointer; }
  #send-btn:disabled { opacity: .3; cursor: not-allowed; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-overlay">
  <div class="auth-card">
    <h2>FastChat</h2>
    <input id="auth-username" type="text" placeholder="Username" maxlength="24" autocomplete="off"/>
    <input id="auth-password" type="password" placeholder="Password" maxlength="64"/>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doAuth('login')">Login</button>
      <button class="btn btn-secondary" onclick="doAuth('register')">Register</button>
    </div>
    <div class="error-msg" id="auth-error"></div>
  </div>
</div>

<!-- Shell -->
<header>
  <span class="logo">FastChat</span>
  <span id="current-user"></span>
  <span id="current-room-label"># general</span>
  <span class="dot" id="dot"></span>
</header>

<div class="layout">
  <!-- Rooms -->
  <div class="rooms-sidebar">
    <div class="sidebar-title">Rooms</div>
    <div id="room-list"></div>
  </div>

  <!-- Chat -->
  <main>
    <div id="messages"></div>
    <div class="input-bar">
      <input id="msg-input" type="text" placeholder="Type a message..." disabled autocomplete="off"/>
      <button id="send-btn" disabled onclick="sendMessage()">Send</button>
    </div>
  </main>

  <!-- Users -->
  <div class="users-sidebar">
    <div class="sidebar-title">Online</div>
    <div id="user-list"></div>
  </div>
</div>

<script>
  let ws = null;
  let myName = "";
  let currentRoom = "general";

  function doAuth(action) {
    const username = document.getElementById("auth-username").value.trim();
    const password = document.getElementById("auth-password").value.trim();
    if (!username || !password) { showError("Please enter username and password."); return; }
    connectWS(action, username, password);
  }

  function connectWS(action, username, password) {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => ws.send(JSON.stringify({ action, username, password }));

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === "auth_fail") { showError(msg.text); ws.close(); return; }

      if (msg.type === "auth_ok") {
        myName = msg.username;
        document.getElementById("auth-overlay").style.display = "none";
        document.getElementById("current-user").textContent = myName;
        document.getElementById("msg-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
        document.getElementById("dot").className = "dot live";
        buildRoomList(msg.rooms);
        return;
      }

      if (msg.type === "history") {
        document.getElementById("messages").innerHTML = "";
        currentRoom = msg.room;
        updateRoomLabel(currentRoom);
        msg.messages.forEach(m => appendMessage(m.sender, m.text, m.timestamp, m.sender === myName));
        return;
      }

      if (msg.type === "system") {
        appendSystem(msg.text);
        if (msg.users) updateUsers(msg.users);
        return;
      }

      if (msg.type === "message") {
        appendMessage(msg.sender, msg.text, msg.timestamp, msg.sender === myName);
      }
    };

    ws.onclose = () => document.getElementById("dot").className = "dot";
  }

  function buildRoomList(rooms) {
    const list = document.getElementById("room-list");
    list.innerHTML = rooms.map(r => `
      <button class="room-btn ${r === currentRoom ? 'active' : ''}"
              onclick="switchRoom('${r}')"># ${r}</button>
    `).join("");
  }

  function switchRoom(room) {
    if (room === currentRoom) return;
    ws.send(JSON.stringify({ type: "switch_room", room }));
    document.querySelectorAll(".room-btn").forEach(b => {
      b.classList.toggle("active", b.textContent.trim() === `# ${room}`);
    });
  }

  function updateRoomLabel(room) {
    document.getElementById("current-room-label").textContent = `# ${room}`;
  }

  function updateUsers(users) {
    document.getElementById("user-list").innerHTML =
      users.map(u => `<div class="user-pill">${esc(u)}</div>`).join("");
  }

  function appendMessage(sender, text, ts, isSelf) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${isSelf ? "self" : "other"}`;
    div.innerHTML = `
      <div class="msg-meta"><span class="sender">${esc(sender)}</span><span>${esc(ts)}</span></div>
      <div class="bubble">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function appendSystem(text) {
    const box = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg system";
    div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ text }));
    input.value = "";
    input.focus();
  }

  function showError(msg) { document.getElementById("auth-error").textContent = msg; }

  document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
  });
  document.getElementById("auth-password").addEventListener("keydown", e => {
    if (e.key === "Enter") doAuth("login");
  });

  function esc(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
